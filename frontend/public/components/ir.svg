<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="IR obstacle sensor module">
  <defs>
    <linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b8fe6"/><stop offset="1" stop-color="#1b4f9f"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#173f82"/><stop offset="1" stop-color="#0d2a5c"/></linearGradient>
    <radialGradient id="clear" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#d4ecff"/><stop offset="1" stop-color="#7fb4e6"/></radialGradient>
    <radialGradient id="dark" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#5a6270"/><stop offset=".55" stop-color="#1f242b"/><stop offset="1" stop-color="#090b0e"/></radialGradient>
    <radialGradient id="red" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#ffb3b3"/><stop offset="1" stop-color="#d31f2a"/></radialGradient>
    <radialGradient id="green" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#c6ffd3"/><stop offset="1" stop-color="#1ea64a"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b98a1d"/><stop offset=".5" stop-color="#ffe08a"/><stop offset="1" stop-color="#b98a1d"/></linearGradient>
    <linearGradient id="potb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5aa9ff"/><stop offset="1" stop-color="#1f5fc1"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <g filter="url(#sh)">
    <rect x="56" y="92" width="288" height="150" rx="14" fill="url(#edge)"/>
    <rect x="56" y="80" width="288" height="150" rx="14" fill="url(#pcb)"/>
    <rect x="60" y="84" width="280" height="5" rx="2.5" fill="#fff" opacity=".18"/>
    <circle cx="74" cy="98" r="5" fill="#0f2f66"/><circle cx="326" cy="98" r="5" fill="#0f2f66"/>
    <!-- IR emitter (clear) and receiver (dark) -->
    <g><rect x="94" y="120" width="40" height="40" rx="6" fill="#cfd8e3"/><circle cx="114" cy="112" r="24" fill="url(#clear)"/><ellipse cx="106" cy="102" rx="8" ry="5" fill="#fff" opacity=".7"/></g>
    <g><rect x="166" y="120" width="40" height="40" rx="6" fill="#1b2026"/><circle cx="186" cy="112" r="24" fill="url(#dark)"/><ellipse cx="178" cy="102" rx="8" ry="5" fill="#fff" opacity=".25"/></g>
    <!-- potentiometer -->
    <rect x="252" y="100" width="62" height="62" rx="6" fill="url(#potb)"/><circle cx="283" cy="131" r="19" fill="#f1f4f8"/><circle cx="283" cy="131" r="15" fill="#dfe5ec"/><rect x="263" y="128" width="40" height="6" rx="3" fill="#4f5b6b" transform="rotate(35 283 131)"/>
    <!-- comparator chip -->
    <rect x="150" y="178" width="64" height="26" rx="3" fill="#15181c"/><g fill="#c0c7cf"><rect x="156" y="204" width="5" height="8"/><rect x="170" y="204" width="5" height="8"/><rect x="184" y="204" width="5" height="8"/><rect x="198" y="204" width="5" height="8"/><rect x="156" y="170" width="5" height="8"/><rect x="170" y="170" width="5" height="8"/><rect x="184" y="170" width="5" height="8"/><rect x="198" y="170" width="5" height="8"/></g>
    <text x="182" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#aab4c0">LM393</text>
    <!-- status LEDs -->
    <rect x="84" y="186" width="30" height="16" rx="3" fill="#e9e1c8"/><circle cx="99" cy="190" r="9" fill="url(#red)"/>
    <rect x="228" y="186" width="30" height="16" rx="3" fill="#e9e1c8"/><circle cx="243" cy="190" r="9" fill="url(#green)"/>
    <!-- pins -->
    <rect x="146" y="226" width="78" height="14" rx="3" fill="#15181c"/>
    <g fill="url(#gold)"><rect x="156" y="236" width="9" height="40" rx="2"/><rect x="180" y="236" width="9" height="40" rx="2"/><rect x="204" y="236" width="9" height="40" rx="2"/></g>
  </g>
  <g fill="none" stroke="#7fe3ff" stroke-width="3" stroke-linecap="round" opacity=".75"><path d="M92 62q22-22 44 0"/><path d="M80 50q34-34 68 0"/></g>
</svg>
