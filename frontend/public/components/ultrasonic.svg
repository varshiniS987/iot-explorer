<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="HC-SR04 ultrasonic sensor">
  <defs>
    <linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b8fe6"/><stop offset="1" stop-color="#1b4f9f"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#173f82"/><stop offset="1" stop-color="#0d2a5c"/></linearGradient>
    <radialGradient id="rim" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#f3f5f8"/><stop offset=".55" stop-color="#a9b2bd"/><stop offset="1" stop-color="#6c7580"/></radialGradient>
    <radialGradient id="mesh" cx=".4" cy=".35" r=".85"><stop offset="0" stop-color="#4b525b"/><stop offset=".6" stop-color="#1d2228"/><stop offset="1" stop-color="#0b0e11"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b98a1d"/><stop offset=".5" stop-color="#ffe08a"/><stop offset="1" stop-color="#b98a1d"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9edf2"/><stop offset="1" stop-color="#8d96a1"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <g filter="url(#sh)">
    <rect x="34" y="82" width="332" height="176" rx="16" fill="url(#edge)"/>
    <rect x="34" y="70" width="332" height="176" rx="16" fill="url(#pcb)"/>
    <rect x="38" y="74" width="324" height="6" rx="3" fill="#fff" opacity=".18"/>
    <g fill="#0f2f66"><circle cx="52" cy="88" r="5"/><circle cx="348" cy="88" r="5"/><circle cx="52" cy="228" r="5"/><circle cx="348" cy="228" r="5"/></g>
    <g fill="#c9d3df" opacity=".35"><circle cx="52" cy="88" r="2"/><circle cx="348" cy="88" r="2"/><circle cx="52" cy="228" r="2"/><circle cx="348" cy="228" r="2"/></g>
    <!-- transducers -->
    <g>
      <ellipse cx="125" cy="166" rx="56" ry="54" fill="#59616b"/>
      <circle cx="125" cy="150" r="56" fill="url(#rim)"/><circle cx="125" cy="150" r="46" fill="url(#mesh)"/>
      <g fill="none" stroke="#7b8590" stroke-width="1.4" opacity=".7"><circle cx="125" cy="150" r="36"/><circle cx="125" cy="150" r="26"/><circle cx="125" cy="150" r="16"/><circle cx="125" cy="150" r="6"/></g>
      <path d="M92 124a46 46 0 0 1 40-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".28"/>
    </g>
    <g>
      <ellipse cx="275" cy="166" rx="56" ry="54" fill="#59616b"/>
      <circle cx="275" cy="150" r="56" fill="url(#rim)"/><circle cx="275" cy="150" r="46" fill="url(#mesh)"/>
      <g fill="none" stroke="#7b8590" stroke-width="1.4" opacity=".7"><circle cx="275" cy="150" r="36"/><circle cx="275" cy="150" r="26"/><circle cx="275" cy="150" r="16"/><circle cx="275" cy="150" r="6"/></g>
      <path d="M242 124a46 46 0 0 1 40-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".28"/>
    </g>
    <rect x="186" y="138" width="28" height="14" rx="3" fill="url(#steel)"/>
    <rect x="190" y="104" width="20" height="9" rx="2" fill="#10151b"/>
    <text x="200" y="214" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" fill="#e8f1ff" opacity=".92">HC-SR04</text>
    <!-- pins -->
    <rect x="148" y="240" width="104" height="16" rx="3" fill="#15181c"/>
    <g fill="url(#gold)"><rect x="158" y="252" width="9" height="40" rx="2"/><rect x="183" y="252" width="9" height="40" rx="2"/><rect x="208" y="252" width="9" height="40" rx="2"/><rect x="233" y="252" width="9" height="40" rx="2"/></g>
  </g>
