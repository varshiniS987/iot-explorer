<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Logic level shifter module with voltage divider resistors">
  <defs>
    <linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b8fe6"/><stop offset="1" stop-color="#1b4f9f"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#173f82"/><stop offset="1" stop-color="#0d2a5c"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b98a1d"/><stop offset=".5" stop-color="#ffe08a"/><stop offset="1" stop-color="#b98a1d"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3dfb2"/><stop offset="1" stop-color="#c9a867"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <g filter="url(#sh)">
    <rect x="70" y="52" width="260" height="128" rx="12" fill="url(#edge)"/>
    <rect x="70" y="42" width="260" height="128" rx="12" fill="url(#pcb)"/>
    <rect x="74" y="46" width="252" height="5" rx="2.5" fill="#fff" opacity=".18"/>
    <!-- header pins top (HV side) and bottom (LV side) -->
    <g fill="#15181c"><rect x="84" y="50" width="232" height="14" rx="2"/><rect x="84" y="148" width="232" height="14" rx="2"/></g>
    <g fill="url(#gold)">
      <rect x="92" y="14" width="9" height="38" rx="2"/><rect x="124" y="14" width="9" height="38" rx="2"/><rect x="156" y="14" width="9" height="38" rx="2"/><rect x="188" y="14" width="9" height="38" rx="2"/><rect x="220" y="14" width="9" height="38" rx="2"/><rect x="252" y="14" width="9" height="38" rx="2"/>
      <rect x="92" y="160" width="9" height="38" rx="2"/><rect x="124" y="160" width="9" height="38" rx="2"/><rect x="156" y="160" width="9" height="38" rx="2"/><rect x="188" y="160" width="9" height="38" rx="2"/><rect x="220" y="160" width="9" height="38" rx="2"/><rect x="252" y="160" width="9" height="38" rx="2"/>
    </g>
    <g fill="#16191d"><rect x="116" y="92" width="22" height="16" rx="2"/><rect x="150" y="92" width="22" height="16" rx="2"/><rect x="184" y="92" width="22" height="16" rx="2"/><rect x="218" y="92" width="22" height="16" rx="2"/></g>
    <g fill="#9aa4b0"><rect x="110" y="96" width="6" height="3"/><rect x="110" y="102" width="6" height="3"/><rect x="138" y="96" width="6" height="3"/><rect x="138" y="102" width="6" height="3"/></g>
    <g font-family="Arial, sans-serif" font-weight="700" fill="#e8f1ff" font-size="13" text-anchor="middle"><text x="96" y="84">HV</text><text x="96" y="140">LV</text><text x="292" y="84">GND</text><text x="292" y="140">GND</text></g>
    <rect x="270" y="92" width="38" height="16" rx="3" fill="#e0e6ee" opacity=".9"/><text x="289" y="104" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#1b4f9f" text-anchor="middle">3V3·5V</text>
  </g>
  <!-- two resistors: the other way to make a voltage divider -->
  <g filter="url(#sh)" transform="translate(0 6)">
    <g transform="rotate(-8 130 258)"><rect x="40" y="256" width="46" height="4" rx="2" fill="#aab2bb"/><rect x="174" y="256" width="46" height="4" rx="2" fill="#aab2bb"/><rect x="80" y="244" width="100" height="28" rx="14" fill="url(#body)"/><rect x="100" y="244" width="8" height="28" fill="#b3221f"/><rect x="116" y="244" width="8" height="28" fill="#111"/><rect x="132" y="244" width="8" height="28" fill="#c0541a"/><rect x="156" y="244" width="6" height="28" fill="#caa100"/></g>
    <g transform="rotate(-8 290 262)"><rect x="224" y="260" width="30" height="4" rx="2" fill="#aab2bb"/><rect x="340" y="260" width="30" height="4" rx="2" fill="#aab2bb"/><rect x="250" y="248" width="92" height="28" rx="14" fill="url(#body)"/><rect x="270" y="248" width="8" height="28" fill="#c0541a"/><rect x="286" y="248" width="8" height="28" fill="#111"/><rect x="302" y="248" width="8" height="28" fill="#c0541a"/><rect x="322" y="248" width="6" height="28" fill="#caa100"/></g>
  </g>
</svg>
